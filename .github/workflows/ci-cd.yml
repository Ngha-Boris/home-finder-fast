name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke checks
        run: npm run test:smoke

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check Supabase migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured; skipping linked migration status check."
            exit 0
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF is not configured; skipping linked migration status check."
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase migration list --linked

  vercel-build:
    name: Vercel build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing GitHub secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing GitHub secret VERCEL_PROJECT_ID"; exit 1; }
          api_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            api_url="${api_url}?teamId=${VERCEL_ORG_ID}"
          fi
          if ! curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "$api_url"; then
            echo "::error::Vercel token cannot access project ${VERCEL_PROJECT_ID}. Confirm VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and optional VERCEL_SCOPE."
            exit 1
          fi
          if [ -n "$VERCEL_SCOPE" ]; then
            echo "Using Vercel scope from VERCEL_SCOPE."
          fi

      - name: Write Vercel project metadata
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull production environment
        run: |
          args=(--yes --environment=production --token="$VERCEL_TOKEN")
          if [ -n "$VERCEL_SCOPE" ]; then
            args+=(--scope="$VERCEL_SCOPE")
          fi
          vercel pull "${args[@]}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Build production bundle
        run: |
          args=(--prod --token="$VERCEL_TOKEN")
          if [ -n "$VERCEL_SCOPE" ]; then
            args+=(--scope="$VERCEL_SCOPE")
          fi
          vercel build "${args[@]}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Upload prebuilt output
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 1

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: vercel-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing GitHub secret VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing GitHub secret VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing GitHub secret VERCEL_PROJECT_ID"; exit 1; }
          api_url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
          if [[ "$VERCEL_ORG_ID" == team_* ]]; then
            api_url="${api_url}?teamId=${VERCEL_ORG_ID}"
          fi
          if ! curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            "$api_url"; then
            echo "::error::Vercel token cannot access project ${VERCEL_PROJECT_ID}. Confirm VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and optional VERCEL_SCOPE."
            exit 1
          fi
          if [ -n "$VERCEL_SCOPE" ]; then
            echo "Using Vercel scope from VERCEL_SCOPE."
          fi

      - name: Write Vercel project metadata
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel project metadata
        run: |
          args=(--yes --environment=production --token="$VERCEL_TOKEN")
          if [ -n "$VERCEL_SCOPE" ]; then
            args+=(--scope="$VERCEL_SCOPE")
          fi
          vercel pull "${args[@]}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

      - name: Download prebuilt output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy to Vercel
        id: deploy
        run: |
          args=(--prebuilt --prod --token="$VERCEL_TOKEN")
          if [ -n "$VERCEL_SCOPE" ]; then
            args+=(--scope="$VERCEL_SCOPE")
          fi
          url="$(vercel deploy "${args[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
